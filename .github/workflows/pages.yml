# Deploys the static site to GitHub Pages from the self-hosted runner (ARC on Proxmox).
# Requires Pages "Build and deployment" source = GitHub Actions (build_type=workflow).
# Only pushes to main trigger it, so pull requests from forks never run on the runner.
name: Deploy Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: axium-linux
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
